<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a5276">
<title>日商簿記3級 学習アプリ</title>
<style>
:root{
--bg:#f5f7fa;--fg:#1a1a2e;--card:#fff;--card2:#f0f4f8;
--pri:#1a5276;--pri2:#2980b9;--acc:#e74c3c;--acc2:#27ae60;
--bdr:#dce1e8;--dim:#7f8c9a;--shadow:0 2px 8px rgba(0,0,0,.08);
--radius:10px;--font-sz:16px;
}
.dark{
--bg:#0f1923;--fg:#e8ecf1;--card:#1a2633;--card2:#243447;
--pri:#5dade2;--pri2:#85c1e9;--acc:#e74c3c;--acc2:#2ecc71;
--bdr:#2c3e50;--dim:#7f8c9a;--shadow:0 2px 8px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
font-size:var(--font-sz);background:var(--bg);color:var(--fg);
min-height:100vh;padding-bottom:70px;transition:background .3s,color .3s}
.hide{display:none!important}
/* Header */
.hd{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;
display:flex;align-items:center;gap:10px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.hd h1{font-size:1.1em;flex:1}
.hd button{background:none;border:none;color:#fff;font-size:1.3em;cursor:pointer;padding:4px}
/* Bottom Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
border-top:1px solid var(--bdr);display:flex;z-index:100;box-shadow:0 -2px 4px rgba(0,0,0,.05)}
.nav button{flex:1;padding:8px 0 6px;border:none;background:none;color:var(--dim);
font-size:.65em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
.nav button.act{color:var(--pri)}
.nav button svg{width:22px;height:22px}
/* Tabs */
.tab{padding:12px 16px;display:none}
.tab.act{display:block}
/* Cards */
.crd{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
box-shadow:var(--shadow);border:1px solid var(--bdr)}
.crd h3{font-size:.95em;margin-bottom:8px;color:var(--pri)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
padding:10px 20px;border-radius:8px;border:none;font-size:.9em;font-weight:600;
cursor:pointer;transition:.2s;font-family:inherit}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri2)}
.btn-ok{background:var(--acc2);color:#fff}
.btn-ng{background:var(--acc);color:#fff}
.btn-out{background:transparent;border:2px solid var(--pri);color:var(--pri)}
.btn-sm{padding:6px 14px;font-size:.8em}
.btn-block{width:100%;margin-top:8px}
/* Mode Selection */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{background:var(--card);border:2px solid var(--bdr);border-radius:var(--radius);
padding:14px;text-align:center;cursor:pointer;transition:.2s}
.mode-btn:hover,.mode-btn.act{border-color:var(--pri);background:var(--card2)}
.mode-btn .ico{font-size:1.5em;margin-bottom:4px}
.mode-btn .lbl{font-size:.8em;font-weight:600}
.mode-btn .sub{font-size:.65em;color:var(--dim);margin-top:2px}
/* Chapter Filter */
.ch-filter{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ch-tag{padding:4px 10px;border-radius:20px;font-size:.75em;border:1px solid var(--bdr);
cursor:pointer;background:var(--card);transition:.2s}
.ch-tag.act{background:var(--pri);color:#fff;border-color:var(--pri)}
/* Quiz Area */
.quiz-area{max-width:600px;margin:0 auto}
.q-num{font-size:.75em;color:var(--dim);margin-bottom:4px}
.q-text{font-size:.95em;line-height:1.6;padding:14px;background:var(--card2);
border-radius:8px;margin-bottom:16px;border-left:4px solid var(--pri)}
/* Journal Entry Form */
.je-form{border:2px solid var(--bdr);border-radius:8px;overflow:hidden;margin:12px 0}
.je-hdr{display:grid;grid-template-columns:1fr 1fr;background:var(--pri);color:#fff;font-size:.8em;font-weight:600;text-align:center}
.je-hdr>div{padding:8px}
.je-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--bdr)}
.je-cell{padding:8px;display:flex;gap:6px;align-items:center}
.je-cell:first-child{border-right:1px solid var(--bdr)}
.je-cell select{flex:1;padding:6px;border:1px solid var(--bdr);border-radius:6px;
font-size:.85em;background:var(--card);color:var(--fg);font-family:inherit}
.je-cell input[type=number]{width:80px;padding:6px;border:1px solid var(--bdr);
border-radius:6px;font-size:.85em;text-align:right;background:var(--card);color:var(--fg)}
.je-cell input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* Answer Display */
.ans-correct{background:#d5f5e3;border:2px solid var(--acc2);border-radius:8px;padding:14px;margin:12px 0}
.ans-wrong{background:#fadbd8;border:2px solid var(--acc);border-radius:8px;padding:14px;margin:12px 0}
.dark .ans-correct{background:#1a3a2a}
.dark .ans-wrong{background:#3a1a1a}
.ans-entry{font-size:.9em;line-height:1.8;margin:8px 0}
.ans-entry .dr{color:var(--pri)}
.ans-entry .cr{color:var(--acc)}
.exp-text{font-size:.85em;color:var(--dim);margin-top:8px;padding:10px;
background:var(--card2);border-radius:6px;line-height:1.6}
/* Progress Bar */
.prog{height:6px;background:var(--bdr);border-radius:3px;margin:8px 0;overflow:hidden}
.prog-fill{height:100%;background:var(--acc2);border-radius:3px;transition:width .3s}
/* Text Learning */
.acc-section{margin-bottom:8px}
.acc-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);
border:1px solid var(--bdr);border-radius:var(--radius);cursor:pointer;transition:.2s}
.acc-hdr:hover{background:var(--card2)}
.acc-hdr .ch-num{background:var(--pri);color:#fff;padding:2px 10px;border-radius:20px;
font-size:.75em;font-weight:600;white-space:nowrap}
.acc-hdr .ch-title{flex:1;font-size:.9em;font-weight:600}
.acc-hdr .ch-badge{font-size:.7em;color:var(--dim)}
.acc-hdr .arrow{transition:transform .3s}
.acc-section.open .arrow{transform:rotate(90deg)}
.acc-body{display:none;padding:12px 16px;border:1px solid var(--bdr);border-top:none;
border-radius:0 0 var(--radius) var(--radius);background:var(--card);line-height:1.7;font-size:.88em}
.acc-section.open .acc-body{display:block}
.acc-body .case-item{padding:10px;margin:6px 0;background:var(--card2);border-radius:8px;border-left:3px solid var(--pri)}
.acc-body .case-title{font-weight:600;font-size:.9em;color:var(--pri);margin-bottom:4px}
.acc-body .case-je{font-family:monospace;font-size:.85em;padding:6px;background:var(--bg);border-radius:4px;margin:4px 0}
/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat-box{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;
border:1px solid var(--bdr)}
.stat-box .num{font-size:1.8em;font-weight:700;color:var(--pri)}
.stat-box .lbl{font-size:.7em;color:var(--dim);margin-top:2px}
/* Account Reference */
.acct-cat{margin-bottom:16px}
.acct-cat h4{font-size:.85em;padding:8px 12px;border-radius:6px;margin-bottom:6px}
.acct-cat.asset h4{background:#d4efdf;color:#1e8449}
.acct-cat.liab h4{background:#fadbd8;color:#c0392b}
.acct-cat.equity h4{background:#d6eaf8;color:#2471a3}
.acct-cat.rev h4{background:#fdebd0;color:#d68910}
.acct-cat.exp h4{background:#e8daef;color:#7d3c98}
.dark .acct-cat.asset h4{background:#1a3a2a;color:#2ecc71}
.dark .acct-cat.liab h4{background:#3a1a1a;color:#e74c3c}
.dark .acct-cat.equity h4{background:#1a2a3a;color:#5dade2}
.dark .acct-cat.rev h4{background:#3a2a1a;color:#f39c12}
.dark .acct-cat.exp h4{background:#2a1a3a;color:#bb8fce}
.acct-item{display:flex;justify-content:space-between;padding:6px 12px;font-size:.85em;
border-bottom:1px solid var(--bdr)}
.acct-item:last-child{border-bottom:none}
.acct-item .pos{font-size:.75em;color:var(--dim)}
/* Memo */
.memo-area{width:100%;min-height:80px;padding:10px;border:1px solid var(--bdr);
border-radius:8px;font-family:inherit;font-size:.85em;resize:vertical;
background:var(--card);color:var(--fg)}
/* Settings */
.setting-row{display:flex;justify-content:space-between;align-items:center;
padding:12px 0;border-bottom:1px solid var(--bdr)}
.setting-row:last-child{border:none}
.toggle{width:48px;height:26px;background:var(--bdr);border-radius:13px;
position:relative;cursor:pointer;transition:.3s}
.toggle.on{background:var(--acc2)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
background:#fff;border-radius:50%;transition:.3s}
.toggle.on::after{left:25px}
/* Responsive */
@media(min-width:768px){
.tab{max-width:700px;margin:0 auto}
.modes{grid-template-columns:repeat(3,1fr)}
}
/* Animation */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .3s ease}
/* Mini test timer */
.timer{font-size:1.5em;font-weight:700;text-align:center;color:var(--acc);padding:8px}
/* Pattern cards */
.ptn-card{margin-bottom:12px;padding:14px;background:var(--card);border-radius:var(--radius);
border:1px solid var(--bdr)}
.ptn-card h4{font-size:.9em;color:var(--pri);margin-bottom:8px}
.ptn-je{font-family:monospace;font-size:.85em;background:var(--card2);padding:8px;
border-radius:6px;margin:4px 0;line-height:1.5}
</style>
</head>
<body>

<!-- Header -->
<div class="hd">
<button onclick="goBack()" id="backBtn" class="hide">◀</button>
<h1>📒 日商簿記3級</h1>
<button onclick="toggleMemo()" title="メモ">📝</button>
<button onclick="switchTab('T-settings')" title="設定">⚙️</button>
</div>

<!-- Bottom Navigation -->
<div class="nav">
<button onclick="switchTab('T-text')" data-tab="T-text" class="act">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
テキスト</button>
<button onclick="switchTab('T-quiz')" data-tab="T-quiz">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
問題</button>
<button onclick="switchTab('T-ref')" data-tab="T-ref">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
科目</button>
<button onclick="switchTab('T-stats')" data-tab="T-stats">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
統計</button>
<button onclick="switchTab('T-more')" data-tab="T-more">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
その他</button>
</div>

<!-- MEMO OVERLAY -->
<div id="memoOverlay" class="hide" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:end">
<div style="background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:60vh;overflow:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3>📝 メモ</h3><button class="btn btn-sm btn-out" onclick="toggleMemo()">閉じる</button>
</div>
<textarea class="memo-area" id="memoText" placeholder="学習メモを自由に記入…" oninput="saveMemo()"></textarea>
</div>
</div>

<!-- TAB: テキスト学習 -->
<div class="tab act" id="T-text">
<div style="margin-bottom:12px">
<h2 style="font-size:1.1em;margin-bottom:4px">📖 テキスト学習</h2>
<p style="font-size:.75em;color:var(--dim)">章をタップして内容を確認。各CASEの仕訳をマスターしよう</p>
</div>
<div id="textSections"></div>
</div>

<!-- TAB: 問題 -->
<div class="tab" id="T-quiz">
<div id="quizMenu">
<h2 style="font-size:1.1em;margin-bottom:12px">✏️ 問題演習</h2>
<div class="ch-filter" id="chFilter"></div>
<div class="modes" id="modeGrid"></div>
</div>
<div id="quizPlay" class="hide quiz-area"></div>
</div>

<!-- TAB: 科目リファレンス -->
<div class="tab" id="T-ref">
<h2 style="font-size:1.1em;margin-bottom:12px">📋 勘定科目リファレンス</h2>
<div id="acctRef"></div>
<h2 style="font-size:1.1em;margin:20px 0 12px">🔄 仕訳パターン集</h2>
<div id="ptnRef"></div>
</div>

<!-- TAB: 統計 -->
<div class="tab" id="T-stats">
<h2 style="font-size:1.1em;margin-bottom:12px">📊 学習統計</h2>
<div class="stat-grid" id="statGrid"></div>
<div class="crd" style="margin-top:12px">
<h3>📅 学習カレンダー</h3>
<div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px"></div>
</div>
<div class="crd">
<h3>📝 章別進捗</h3>
<div id="chProgress"></div>
</div>
</div>

<!-- TAB: その他 -->
<div class="tab" id="T-more">
<h2 style="font-size:1.1em;margin-bottom:12px">⚙️ その他</h2>
<div class="crd"><h3>🎯 目標設定</h3>
<div class="setting-row"><span>1日の目標問題数</span>
<input type="number" id="goalCount" value="10" min="1" max="100" style="width:60px;padding:4px;border:1px solid var(--bdr);border-radius:4px;text-align:center" onchange="saveGoal()"></div>
<div class="setting-row"><span>目標正答率</span>
<input type="number" id="goalRate" value="80" min="1" max="100" style="width:60px;padding:4px;border:1px solid var(--bdr);border-radius:4px;text-align:center" onchange="saveGoal()">%</div>
</div>
<div class="crd"><h3>📋 問題一覧</h3>
<button class="btn btn-out btn-block" onclick="showQList()">全問題を表示</button>
<div id="qList" class="hide" style="margin-top:12px;max-height:400px;overflow:auto"></div>
</div>
<div class="crd" id="T-settings">
<h3>🔧 設定</h3>
<div class="setting-row"><span>ダークモード</span><div class="toggle" id="darkToggle" onclick="toggleDark()"></div></div>
<div class="setting-row"><span>フォントサイズ</span>
<select onchange="setFontSize(this.value)" id="fontSel" style="padding:4px;border:1px solid var(--bdr);border-radius:4px">
<option value="14px">小</option><option value="16px" selected>中</option><option value="18px">大</option><option value="20px">特大</option></select></div>
<div class="setting-row"><span>音声読み上げ(TTS)</span><div class="toggle" id="ttsToggle" onclick="toggleTTS()"></div></div>
</div>
<div class="crd"><h3>💾 データ管理</h3>
<button class="btn btn-out btn-block" onclick="exportData()">📤 データ書き出し</button>
<button class="btn btn-out btn-block" onclick="document.getElementById('importFile').click()">📥 データ読み込み</button>
<input type="file" id="importFile" class="hide" accept=".json" onchange="importData(event)">
<button class="btn btn-ng btn-block" onclick="resetData()" style="margin-top:16px">🗑️ データリセット</button>
</div>
</div>

<script>

/* ===== DATA ===== */
const ALL=[{"id": 1, "ch": 2, "case": 3, "title": "商品を仕入れたときの仕訳（現金）", "q": "ゴエモン㈱は、仕入先クロキチ㈱から商品100円を仕入れ、代金は現金で支払った。", "entries": [{"dr": "仕入", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "商品を仕入れたときは仕入（費用）で処理。現金で支払ったので現金（資産）の減少。"}, {"id": 2, "ch": 2, "case": 4, "title": "商品を売り上げたときの仕訳（現金）", "q": "ゴエモン㈱は、商品150円を得意先シロミ㈱に売り上げ、代金は現金で受け取った。", "entries": [{"dr": "現金", "dr_amt": 150, "cr": "売上", "cr_amt": 150}], "exp": "商品を売り上げたときは売上（収益）で処理。現金で受け取ったので現金（資産）の増加。"}, {"id": 3, "ch": 2, "case": 5, "title": "掛けで仕入れたときの仕訳", "q": "ゴエモン㈱は、仕入先クロキチ㈱より商品100円を仕入れ、代金は掛けとした。", "entries": [{"dr": "仕入", "dr_amt": 100, "cr": "買掛金", "cr_amt": 100}], "exp": "掛けで仕入れたときは買掛金（負債）の増加として処理。"}, {"id": 4, "ch": 2, "case": 6, "title": "掛けで売り上げたときの仕訳", "q": "ゴエモン㈱は、得意先シロミ㈱へ商品150円を売り上げ、代金は掛けとした。", "entries": [{"dr": "売掛金", "dr_amt": 150, "cr": "売上", "cr_amt": 150}], "exp": "掛けで売り上げたときは売掛金（資産）の増加として処理。"}, {"id": 5, "ch": 2, "case": 7, "title": "クレジット払いで売り上げたときの仕訳", "q": "ゴエモン㈱は、商品200円をクレジット払いの条件で売り上げた。なお、信販会社への手数料（販売代金の5%）は販売時に計上する。", "entries": [{"dr": "クレジット売掛金", "dr_amt": 190, "cr": "売上", "cr_amt": 200}, {"dr": "支払手数料", "dr_amt": 10}], "exp": "クレジット売掛金（資産）で処理。手数料は支払手数料（費用）として販売時に計上。"}, {"id": 6, "ch": 2, "case": 8, "title": "仕入れた商品を返品したときの仕訳", "q": "ゴエモン㈱は、先日クロキチ㈱より掛けで仕入れた商品のうち、10円分を品違いのため返品した。", "entries": [{"dr": "買掛金", "dr_amt": 10, "cr": "仕入", "cr_amt": 10}], "exp": "仕入戻しは仕入れたときの逆仕訳。買掛金（負債）の減少と仕入（費用）の減少。"}, {"id": 7, "ch": 2, "case": 9, "title": "仕入諸掛り（当社負担）の仕訳", "q": "ゴエモン㈱は、クロキチ㈱より商品100円を仕入れ、代金は掛けとした。なお、引取運賃（当社負担）10円を現金で支払った。", "entries": [{"dr": "仕入", "dr_amt": 110, "cr": "買掛金", "cr_amt": 100}, {"cr": "現金", "cr_amt": 10}], "exp": "当社負担の引取運賃は仕入原価に含める。仕入100+運賃10=110円。"}, {"id": 8, "ch": 2, "case": 10, "title": "売上諸掛り（当社負担）の仕訳", "q": "ゴエモン㈱は、シロミ㈱へ商品160円を掛けで販売した。また、発送運賃10円（当社負担）は現金で支払った。", "entries": [{"dr": "売掛金", "dr_amt": 160, "cr": "売上", "cr_amt": 160}, {"dr": "発送費", "dr_amt": 10, "cr": "現金", "cr_amt": 10}], "exp": "当社負担の発送費は費用処理。売上とは別に発送費（費用）として計上。"}, {"id": 9, "ch": 3, "case": 11, "title": "他人振出小切手を受け取ったときの仕訳", "q": "ゴエモン㈱は、シロミ㈱に商品150円を売り上げ、代金は同社振出の小切手で受け取った。", "entries": [{"dr": "現金", "dr_amt": 150, "cr": "売上", "cr_amt": 150}], "exp": "他人振出小切手は現金として処理する。"}, {"id": 10, "ch": 3, "case": 12, "title": "現金過不足（帳簿＞実際）の仕訳", "q": "現金の帳簿残高は120円であるが、実際有高を調べたところ100円であった。", "entries": [{"dr": "現金過不足", "dr_amt": 20, "cr": "現金", "cr_amt": 20}], "exp": "帳簿残高＞実際有高のとき、現金を減らし現金過不足で処理。"}, {"id": 11, "ch": 3, "case": 13, "title": "現金過不足の原因が判明したときの仕訳", "q": "かねて現金過不足勘定で処理していた現金不足額20円のうち、10円は通信費の記帳もれであることが判明した。残額は原因不明のままである。", "entries": [{"dr": "通信費", "dr_amt": 10, "cr": "現金過不足", "cr_amt": 10}], "exp": "原因判明分を該当する勘定科目に振り替える。"}, {"id": 12, "ch": 3, "case": 14, "title": "決算日に現金過不足の原因不明分を処理する仕訳", "q": "決算日において、現金過不足勘定の残高（借方）10円の原因が不明のため、適切な勘定に振り替える。", "entries": [{"dr": "雑損", "dr_amt": 10, "cr": "現金過不足", "cr_amt": 10}], "exp": "決算日まで原因不明の場合、借方残高は雑損（費用）、貸方残高は雑益（収益）で処理。"}, {"id": 13, "ch": 4, "case": 15, "title": "普通預金口座に預け入れたときの仕訳", "q": "ゴエモン㈱は現金100円を賽西銀行の普通預金口座に預け入れた。", "entries": [{"dr": "普通預金", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "普通預金（資産）の増加と現金（資産）の減少。"}, {"id": 14, "ch": 4, "case": 16, "title": "定期預金口座に預け入れたときの仕訳", "q": "ゴエモン㈱は賽西銀行の普通預金口座から定期預金口座へ100円を預け入れた。", "entries": [{"dr": "定期預金", "dr_amt": 100, "cr": "普通預金", "cr_amt": 100}], "exp": "定期預金（資産）の増加と普通預金（資産）の減少。"}, {"id": 15, "ch": 4, "case": 17, "title": "当座預金口座に預け入れたときの仕訳", "q": "ゴエモン㈱は、賽西銀行と当座取引契約を結び、現金100円を当座預金口座に預け入れた。", "entries": [{"dr": "当座預金", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "当座預金（資産）の増加。"}, {"id": 16, "ch": 4, "case": 18, "title": "小切手を振り出したときの仕訳", "q": "ゴエモン㈱はクロキチ㈱に対する買掛金100円を支払うため、小切手を振り出して渡した。", "entries": [{"dr": "買掛金", "dr_amt": 100, "cr": "当座預金", "cr_amt": 100}], "exp": "小切手を振り出すと当座預金（資産）が減少する。"}, {"id": 17, "ch": 4, "case": 19, "title": "当座預金の残高を超えて引き出したときの仕訳", "q": "ゴエモン㈱は、クロキチ㈱より商品200円を仕入れ、小切手を振り出して支払った。なお、当座預金の残高は150円であり、賽西銀行との間に借越限度額500円の当座借越契約を結んでいる。", "entries": [{"dr": "仕入", "dr_amt": 200, "cr": "当座預金", "cr_amt": 200}], "exp": "当座借越契約がある場合、残高を超えても当座預金勘定で処理する。"}, {"id": 18, "ch": 4, "case": 20, "title": "決算日の当座借越の振り替え仕訳", "q": "決算日において当座預金が20円の貸方残高であるため、当座借越勘定に振り替える。", "entries": [{"dr": "当座預金", "dr_amt": 20, "cr": "当座借越", "cr_amt": 20}], "exp": "決算日に当座預金の貸方残高は当座借越（負債）に振り替える。"}, {"id": 19, "ch": 5, "case": 21, "title": "小口現金を前渡ししたときの仕訳", "q": "会計係は小口現金係に小口現金500円を小切手を振り出して前渡しした。", "entries": [{"dr": "小口現金", "dr_amt": 500, "cr": "当座預金", "cr_amt": 500}], "exp": "小口現金（資産）の増加と当座預金（資産）の減少。"}, {"id": 20, "ch": 5, "case": 23, "title": "小口現金係から支払報告を受けたときの仕訳", "q": "小口現金係より、文房具代（消耗品費）100円とお茶菓子代（雑費）200円を小口現金で支払ったという報告を受けた。", "entries": [{"dr": "消耗品費", "dr_amt": 100, "cr": "小口現金", "cr_amt": 300}, {"dr": "雑費", "dr_amt": 200}], "exp": "支払報告を受けたら各費用を計上し、小口現金を減少させる。"}, {"id": 21, "ch": 5, "case": 24, "title": "小口現金を補給したときの仕訳", "q": "会計係は小口現金係に小口現金300円を小切手を振り出して補給した。", "entries": [{"dr": "小口現金", "dr_amt": 300, "cr": "当座預金", "cr_amt": 300}], "exp": "定額資金前渡法（インプレスト・システム）では使った分だけ補給する。"}, {"id": 22, "ch": 6, "case": 25, "title": "約束手形を振り出したときの仕訳", "q": "ゴエモン㈱は、クロキチ㈱より商品100円を仕入れ、代金は約束手形を振り出して支払った。", "entries": [{"dr": "仕入", "dr_amt": 100, "cr": "支払手形", "cr_amt": 100}], "exp": "約束手形を振り出したときは支払手形（負債）の増加。"}, {"id": 23, "ch": 6, "case": 26, "title": "約束手形を受け取ったときの仕訳", "q": "ゴエモン㈱は、シロミ㈱へ商品100円を売り上げ、代金は同社振出の約束手形で受け取った。", "entries": [{"dr": "受取手形", "dr_amt": 100, "cr": "売上", "cr_amt": 100}], "exp": "約束手形を受け取ったときは受取手形（資産）の増加。"}, {"id": 24, "ch": 6, "case": 28, "title": "電子記録債権が発生したときの仕訳", "q": "ゴエモン㈱は、シロミ㈱に対する売掛金100円について、同社の承諾を得て電子記録債権の発生記録を行った。", "entries": [{"dr": "電子記録債権", "dr_amt": 100, "cr": "売掛金", "cr_amt": 100}], "exp": "電子記録債権（資産）が発生し、売掛金（資産）が減少する。"}, {"id": 25, "ch": 6, "case": 29, "title": "電子記録債権が消滅したときの仕訳", "q": "ゴエモン㈱の電子記録債権100円の支払期日が到来し、当座預金口座に振り込まれた。", "entries": [{"dr": "当座預金", "dr_amt": 100, "cr": "電子記録債権", "cr_amt": 100}], "exp": "支払期日到来で口座に入金され、電子記録債権（資産）が消滅。"}, {"id": 26, "ch": 7, "case": 30, "title": "お金を貸し付けたときの仕訳", "q": "ゴエモン㈱は、取引先に現金500円を貸し付けた。", "entries": [{"dr": "貸付金", "dr_amt": 500, "cr": "現金", "cr_amt": 500}], "exp": "お金を貸し付けたときは貸付金（資産）の増加。"}, {"id": 27, "ch": 7, "case": 31, "title": "貸付金を返してもらったときの仕訳", "q": "ゴエモン㈱は、貸付金500円の返済を受け、利息10円とともに現金で受け取った。", "entries": [{"dr": "現金", "dr_amt": 510, "cr": "貸付金", "cr_amt": 500}, {"cr": "受取利息", "cr_amt": 10}], "exp": "貸付金（資産）の減少と受取利息（収益）の発生。"}, {"id": 28, "ch": 7, "case": 32, "title": "お金を借り入れたときの仕訳", "q": "ゴエモン㈱は、取引銀行から現金600円を借り入れた。", "entries": [{"dr": "現金", "dr_amt": 600, "cr": "借入金", "cr_amt": 600}], "exp": "お金を借り入れたときは借入金（負債）の増加。"}, {"id": 29, "ch": 7, "case": 33, "title": "借入金を返したときの仕訳", "q": "ゴエモン㈱は、取引銀行に借入金600円を返済し、利息10円とともに現金で支払った。", "entries": [{"dr": "借入金", "dr_amt": 600, "cr": "現金", "cr_amt": 610}, {"dr": "支払利息", "dr_amt": 10}], "exp": "借入金（負債）の減少と支払利息（費用）の発生。"}, {"id": 30, "ch": 7, "case": 34, "title": "手形貸付金の仕訳", "q": "ゴエモン㈱は、取引先に現金100円を貸し付け、約束手形を受け取った。", "entries": [{"dr": "手形貸付金", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "手形を受け取って貸し付けたときは手形貸付金（資産）で処理。"}, {"id": 31, "ch": 7, "case": 35, "title": "手形借入金の仕訳", "q": "ゴエモン㈱は、取引銀行から現金100円を借り入れ、約束手形を振り出した。", "entries": [{"dr": "現金", "dr_amt": 100, "cr": "手形借入金", "cr_amt": 100}], "exp": "手形を振り出して借り入れたときは手形借入金（負債）で処理。"}, {"id": 32, "ch": 8, "case": 36, "title": "商品以外のものを後払いで買ったときの仕訳", "q": "ゴエモン㈱は、営業用の建物100円を購入し、代金は月末に支払うこととした。", "entries": [{"dr": "建物", "dr_amt": 100, "cr": "未払金", "cr_amt": 100}], "exp": "商品以外のものの未払額は未払金（負債）で処理。買掛金ではない。"}, {"id": 33, "ch": 8, "case": 37, "title": "商品以外のものを売って代金をあとで受け取る仕訳", "q": "ゴエモン㈱は、不要になった備品（帳簿価額100円）を100円で売却し、代金は月末に受け取ることとした。", "entries": [{"dr": "未収入金", "dr_amt": 100, "cr": "備品", "cr_amt": 100}], "exp": "商品以外のものの未収額は未収入金（資産）で処理。売掛金ではない。"}, {"id": 34, "ch": 8, "case": 38, "title": "内金を支払ったときの仕訳", "q": "ゴエモン㈱は、商品の注文にあたって、内金20円を現金で支払った。", "entries": [{"dr": "前払金", "dr_amt": 20, "cr": "現金", "cr_amt": 20}], "exp": "内金を支払ったときは前払金（資産）で処理。"}, {"id": 35, "ch": 8, "case": 39, "title": "内金を支払って商品を仕入れたときの仕訳", "q": "ゴエモン㈱は、先に注文していた商品100円を仕入れ、内金20円を差し引いた残額は掛けとした。", "entries": [{"dr": "仕入", "dr_amt": 100, "cr": "前払金", "cr_amt": 20}, {"cr": "買掛金", "cr_amt": 80}], "exp": "前払金（資産）を減らし、残額は買掛金（負債）で処理。"}, {"id": 36, "ch": 8, "case": 40, "title": "内金を受け取ったときの仕訳", "q": "ゴエモン㈱は、商品の注文を受け、内金20円を現金で受け取った。", "entries": [{"dr": "現金", "dr_amt": 20, "cr": "前受金", "cr_amt": 20}], "exp": "内金を受け取ったときは前受金（負債）で処理。"}, {"id": 37, "ch": 8, "case": 41, "title": "内金を受け取って商品を売り上げたときの仕訳", "q": "ゴエモン㈱は、先に注文を受けていた商品100円を売り上げ、内金20円を差し引いた残額は掛けとした。", "entries": [{"dr": "前受金", "dr_amt": 20, "cr": "売上", "cr_amt": 100}, {"dr": "売掛金", "dr_amt": 80}], "exp": "前受金（負債）を減らし、残額は売掛金（資産）で処理。"}, {"id": 38, "ch": 8, "case": 42, "title": "旅費の概算額を前渡ししたときの仕訳", "q": "ゴエモン㈱は、従業員の出張にあたって、旅費の概算額100円を現金で前渡しした。", "entries": [{"dr": "仮払金", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "概算額の前渡しは仮払金（資産）で処理。"}, {"id": 39, "ch": 8, "case": 43, "title": "仮払金の内容と金額が確定したときの仕訳", "q": "従業員が出張から戻り、旅費交通費が80円であることが判明し、残額20円は現金で返金された。", "entries": [{"dr": "旅費交通費", "dr_amt": 80, "cr": "仮払金", "cr_amt": 100}, {"dr": "現金", "dr_amt": 20}], "exp": "仮払金（資産）を該当する勘定科目に振り替え、残額は返金処理。"}, {"id": 40, "ch": 8, "case": 44, "title": "内容不明の入金があったときの仕訳", "q": "出張中の従業員から当座預金口座に100円の入金があったが、その内容は不明である。", "entries": [{"dr": "当座預金", "dr_amt": 100, "cr": "仮受金", "cr_amt": 100}], "exp": "内容不明の入金は仮受金（負債）で処理。"}, {"id": 41, "ch": 8, "case": 45, "title": "仮受金の内容が明らかになったときの仕訳", "q": "先の当座預金口座への入金100円は、得意先から売掛金を回収した金額であることが判明した。", "entries": [{"dr": "仮受金", "dr_amt": 100, "cr": "売掛金", "cr_amt": 100}], "exp": "仮受金（負債）を該当する勘定科目に振り替える。"}, {"id": 42, "ch": 8, "case": 46, "title": "先方負担の仕入諸掛りを立て替えたときの仕訳", "q": "ゴエモン㈱は商品100円を仕入れ、代金は掛けとした。なお、先方負担の引取運賃10円を現金で立て替えた。", "entries": [{"dr": "仕入", "dr_amt": 100, "cr": "買掛金", "cr_amt": 100}, {"dr": "立替金", "dr_amt": 10, "cr": "現金", "cr_amt": 10}], "exp": "先方負担の諸掛りは立替金（資産）で処理（または買掛金と相殺）。"}, {"id": 43, "ch": 8, "case": 47, "title": "従業員立替金の仕訳", "q": "ゴエモン㈱は、従業員が負担すべき生命保険料40円を現金で立て替えて支払った。", "entries": [{"dr": "従業員立替金", "dr_amt": 40, "cr": "現金", "cr_amt": 40}], "exp": "従業員が負担すべき金額を立て替えたときは従業員立替金（資産）で処理。"}, {"id": 44, "ch": 8, "case": 48, "title": "給料支払時に立替金を差し引く仕訳", "q": "ゴエモン㈱は、従業員に給料500円を支払う際、先に立て替えていた生命保険料40円を差し引き、残額を現金で支払った。", "entries": [{"dr": "給料", "dr_amt": 500, "cr": "従業員立替金", "cr_amt": 40}, {"cr": "現金", "cr_amt": 460}], "exp": "給料（費用）の発生。従業員立替金（資産）を回収し、残額を現金で支払う。"}, {"id": 45, "ch": 8, "case": 49, "title": "給料支払時に源泉徴収税額を差し引く仕訳", "q": "給料500円のうち、源泉徴収税額50円を差し引いた残額を従業員に現金で支払った。", "entries": [{"dr": "給料", "dr_amt": 500, "cr": "預り金", "cr_amt": 50}, {"cr": "現金", "cr_amt": 450}], "exp": "源泉徴収税額は預り金（負債）として処理。あとで従業員に代わって国に納める。"}, {"id": 46, "ch": 8, "case": 50, "title": "預り金を支払ったときの仕訳", "q": "預り金として処理していた源泉徴収税額50円を、税務署に現金で納付した。", "entries": [{"dr": "預り金", "dr_amt": 50, "cr": "現金", "cr_amt": 50}], "exp": "預り金（負債）の減少。預かっていたお金を返す義務がなくなる。"}, {"id": 47, "ch": 8, "case": 51, "title": "商品を売り上げ、商品券を受け取ったときの仕訳", "q": "ゴエモン㈱は商品150円を売り上げ、自治体が発行した商品券100円と現金50円を受け取った。", "entries": [{"dr": "受取商品券", "dr_amt": 100, "cr": "売上", "cr_amt": 150}, {"dr": "現金", "dr_amt": 50}], "exp": "自治体等が発行した商品券はあとで買い取ってもらえるので受取商品券（資産）で処理。"}, {"id": 48, "ch": 8, "case": 52, "title": "商品券を買い取ってもらったときの仕訳", "q": "ゴエモン㈱は所有している自治体発行の商品券100円を買い取ってもらい、代金は現金で受け取った。", "entries": [{"dr": "現金", "dr_amt": 100, "cr": "受取商品券", "cr_amt": 100}], "exp": "受取商品券（資産）の減少。"}, {"id": 49, "ch": 8, "case": 53, "title": "敷金や保証金を支払ったときの仕訳", "q": "ゴエモン㈱は、店舗の賃借にあたって、敷金100円を現金で支払った。", "entries": [{"dr": "差入保証金", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "敷金や保証金は退去時に返してもらえるので差入保証金（資産）で処理。"}, {"id": 50, "ch": 9, "case": 54, "title": "消耗品を買ったときの仕訳", "q": "ゴエモン㈱はコピー用紙（消耗品）100円を購入し、現金で支払った。", "entries": [{"dr": "消耗品費", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "消耗品を購入したときは消耗品費（費用）で処理。"}, {"id": 51, "ch": 9, "case": 55, "title": "切手やはがきを買ったときの仕訳", "q": "ゴエモン㈱は、郵便切手150円分を購入し、現金で支払った。", "entries": [{"dr": "通信費", "dr_amt": 150, "cr": "現金", "cr_amt": 150}], "exp": "郵便切手や郵便はがきの購入は通信費（費用）で処理。"}, {"id": 52, "ch": 9, "case": 56, "title": "固定資産税などを支払ったときの仕訳", "q": "ゴエモン㈱は、会社の建物の固定資産税40円を現金で支払った。", "entries": [{"dr": "租税公課", "dr_amt": 40, "cr": "現金", "cr_amt": 40}], "exp": "固定資産税、自動車税、印紙税などの税金は租税公課（費用）で処理。"}, {"id": 53, "ch": 9, "case": 57, "title": "決算日に切手や収入印紙が残っているときの仕訳", "q": "決算日において郵便切手50円分と収入印紙70円分が残っている。購入時に郵便切手は通信費、収入印紙は租税公課で処理している。", "entries": [{"dr": "貯蔵品", "dr_amt": 120, "cr": "通信費", "cr_amt": 50}, {"cr": "租税公課", "cr_amt": 70}], "exp": "残っている分だけ通信費・租税公課（費用）から貯蔵品（資産）に振り替える。"}, {"id": 54, "ch": 9, "case": 58, "title": "社会保険料（会社負担分）を納付したときの仕訳", "q": "ゴエモン㈱は、従業員の健康保険料と厚生年金保険料について、会社負担分である100円を現金で納付した。", "entries": [{"dr": "法定福利費", "dr_amt": 100, "cr": "現金", "cr_amt": 100}], "exp": "会社負担分の社会保険料は法定福利費（費用）で処理。"}, {"id": 55, "ch": 10, "case": 59, "title": "当期に発生した売掛金が貸し倒れたときの仕訳", "q": "得意先シャム㈱が倒産し、売掛金100円（当期に発生）が貸し倒れた。", "entries": [{"dr": "貸倒損失", "dr_amt": 100, "cr": "売掛金", "cr_amt": 100}], "exp": "当期に発生した売掛金の貸倒れは全額、貸倒損失（費用）で処理。"}, {"id": 56, "ch": 10, "case": 60, "title": "貸倒引当金の設定（差額補充法）の仕訳", "q": "決算日において、売掛金の期末残高400円について、2%の貸倒引当金を設定する（差額補充法）。", "entries": [{"dr": "貸倒引当金繰入", "dr_amt": 8, "cr": "貸倒引当金", "cr_amt": 8}], "exp": "貸倒引当金の設定額＝400円×2%＝8円。貸倒引当金繰入（費用）で処理。"}, {"id": 57, "ch": 10, "case": 61, "title": "前期以前に発生した売掛金が貸し倒れたときの仕訳", "q": "得意先シロミ㈱が倒産し、売掛金（前期に発生）50円が貸し倒れた。なお、貸倒引当金の残高が8円ある。", "entries": [{"dr": "貸倒引当金", "dr_amt": 8, "cr": "売掛金", "cr_amt": 50}, {"dr": "貸倒損失", "dr_amt": 42}], "exp": "まず貸倒引当金を取り崩し、超過額は貸倒損失（費用）で処理。"}, {"id": 58, "ch": 10, "case": 62, "title": "前期に貸倒処理した売掛金を回収したときの仕訳", "q": "前期に貸倒処理したシロミ㈱に対する売掛金50円を現金で回収した。", "entries": [{"dr": "現金", "dr_amt": 50, "cr": "償却債権取立益", "cr_amt": 50}], "exp": "前期以前に貸倒処理した売掛金の回収は償却債権取立益（収益）で処理。"}, {"id": 59, "ch": 11, "case": 63, "title": "固定資産を購入したときの仕訳", "q": "ゴエモン㈱は、建物1,600円を購入し、代金は月末に支払うこととした。なお、購入にあたっての登記料140円と仲介手数料60円は現金で支払った。", "entries": [{"dr": "建物", "dr_amt": 1800, "cr": "未払金", "cr_amt": 1600}, {"cr": "現金", "cr_amt": 200}], "exp": "取得原価＝購入代価1,600＋付随費用200（登記料140＋手数料60）＝1,800円。"}, {"id": 60, "ch": 11, "case": 64, "title": "固定資産の減価償却（期首取得・定額法）の仕訳", "q": "決算につき、当期首に購入した建物（取得原価1,800円）について減価償却を行う。なお、減価償却方法は定額法（耐用年数30年、残存価額はゼロ）、記帳方法は間接法による。", "entries": [{"dr": "減価償却費", "dr_amt": 60, "cr": "減価償却累計額", "cr_amt": 60}], "exp": "減価償却費＝1,800円÷30年＝60円。間接法では減価償却累計額（資産のマイナス）を使う。"}, {"id": 61, "ch": 11, "case": 65, "title": "固定資産の減価償却（期中取得・月割計算）の仕訳", "q": "決算につき、12月1日に購入した建物（取得原価1,800円）について減価償却を行う。なお、定額法（耐用年数30年、残存価額はゼロ）、間接法による。会計期間は4月1日〜3月31日。", "entries": [{"dr": "減価償却費", "dr_amt": 20, "cr": "減価償却累計額", "cr_amt": 20}], "exp": "1年分の減価償却費60円×4か月/12か月＝20円。期中取得は月割計算。"}, {"id": 62, "ch": 11, "case": 66, "title": "固定資産を売却したときの仕訳（売却益）", "q": "当期首において、備品（取得原価400円、減価償却累計額150円、間接法で記帳）を280円で売却し、代金は月末に受け取ることとした。", "entries": [{"dr": "未収入金", "dr_amt": 280, "cr": "備品", "cr_amt": 400}, {"dr": "減価償却累計額", "dr_amt": 150, "cr": "固定資産売却益", "cr_amt": 30}], "exp": "帳簿価額250円（400-150）＜売却価額280円なので、差額30円は固定資産売却益（収益）。"}, {"id": 63, "ch": 11, "case": 67, "title": "固定資産を売却したときの仕訳（期中売却・売却損）", "q": "ゴエモン㈱は、トラック（取得原価900円、期首の減価償却累計額540円、定額法、残存価額ゼロ、耐用年数5年、間接法）を1月31日に200円で売却し、代金は月末に受け取ることとした。会計期間は4月1日〜3月31日。", "entries": [{"dr": "減価償却累計額", "dr_amt": 540, "cr": "車両運搬具", "cr_amt": 900}, {"dr": "未収入金", "dr_amt": 200}, {"dr": "減価償却費", "dr_amt": 150}, {"dr": "固定資産売却損", "dr_amt": 10}], "exp": "当期分の減価償却費180円×10か月/12か月＝150円を計上。帳簿価額210円＞売却価額200円なので売却損10円。"}, {"id": 64, "ch": 12, "case": 69, "title": "会社を設立して株式を発行したときの仕訳", "q": "ゴエモン㈱は、会社の設立にあたって株式100株を1株あたり10円で発行し、全株式の払い込みを受け、払込金額は普通預金とした。", "entries": [{"dr": "普通預金", "dr_amt": 1000, "cr": "資本金", "cr_amt": 1000}], "exp": "払込金額の全額を資本金（純資産）として処理。@10円×100株＝1,000円。"}, {"id": 65, "ch": 12, "case": 70, "title": "増資をしたときの仕訳", "q": "増資のため、株式20株を1株あたり10円で発行し、全株式の払い込みを受け、払込金額は当座預金とした。", "entries": [{"dr": "当座預金", "dr_amt": 200, "cr": "資本金", "cr_amt": 200}], "exp": "増資でも設立時と同様、払込金額を資本金として処理。@10円×20株＝200円。"}, {"id": 66, "ch": 12, "case": 71, "title": "当期純利益を計上したときの仕訳", "q": "ゴエモン㈱は第1期の決算において当期純利益260円を計上した。", "entries": [{"dr": "損益", "dr_amt": 260, "cr": "繰越利益剰余金", "cr_amt": 260}], "exp": "当期純利益は損益勘定から繰越利益剰余金勘定の貸方に振り替える。"}, {"id": 67, "ch": 12, "case": 72, "title": "剰余金を配当、処分したときの仕訳", "q": "株主総会において、繰越利益剰余金1,000円を次のように配当、処分することが承認された。株主配当金500円、利益準備金50円。", "entries": [{"dr": "繰越利益剰余金", "dr_amt": 550, "cr": "未払配当金", "cr_amt": 500}, {"cr": "利益準備金", "cr_amt": 50}], "exp": "繰越利益剰余金からそれぞれの勘定科目に振り替え。配当金は未払配当金（負債）。"}, {"id": 68, "ch": 13, "case": 73, "title": "法人税等を中間申告、納付したときの仕訳", "q": "ゴエモン㈱は、法人税の中間納付を行い、税額100円を小切手を振り出して納付した。", "entries": [{"dr": "仮払法人税等", "dr_amt": 100, "cr": "当座預金", "cr_amt": 100}], "exp": "中間納付額は概算額なので仮払法人税等（資産）で処理。"}, {"id": 69, "ch": 13, "case": 74, "title": "法人税等が確定したとき（決算時）の仕訳", "q": "決算の結果、法人税、住民税及び事業税が210円と計算された。なお、中間納付額100円を差し引いた金額を未払分として計上した。", "entries": [{"dr": "法人税、住民税及び事業税", "dr_amt": 210, "cr": "仮払法人税等", "cr_amt": 100}, {"cr": "未払法人税等", "cr_amt": 110}], "exp": "確定額210円から中間納付額100円を差引き、差額110円は未払法人税等（負債）。"}, {"id": 70, "ch": 13, "case": 75, "title": "消費税を支払ったときの仕訳（税抜方式）", "q": "ゴエモン㈱はクロキチ㈱より商品110円（税込価額）を仕入れ、代金は現金で支払った。なお、消費税率は10%である。", "entries": [{"dr": "仕入", "dr_amt": 100, "cr": "現金", "cr_amt": 110}, {"dr": "仮払消費税", "dr_amt": 10}], "exp": "支払った消費税10円は仮払消費税（資産）で処理。仕入は税抜価額100円。"}, {"id": 71, "ch": 13, "case": 76, "title": "消費税を受け取ったときの仕訳（税抜方式）", "q": "商品330円（税込価額）を売り上げ、代金は現金で受け取った。なお、消費税率は10%である。", "entries": [{"dr": "現金", "dr_amt": 330, "cr": "売上", "cr_amt": 300}, {"cr": "仮受消費税", "cr_amt": 30}], "exp": "受け取った消費税30円は仮受消費税（負債）で処理。売上は税抜価額300円。"}, {"id": 72, "ch": 13, "case": 77, "title": "消費税の決算時の仕訳", "q": "決算につき、仮払消費税10円と仮受消費税30円を相殺し、納付額を確定する。", "entries": [{"dr": "仮受消費税", "dr_amt": 30, "cr": "仮払消費税", "cr_amt": 10}, {"cr": "未払消費税", "cr_amt": 20}], "exp": "仮払消費税と仮受消費税を相殺し、差額は未払消費税（負債）で処理。"}, {"id": 73, "ch": 14, "case": 78, "title": "家賃を前払いしたときの仕訳", "q": "ゴエモン㈱は、向こう1年分の家賃120円を現金で支払った。", "entries": [{"dr": "支払家賃", "dr_amt": 120, "cr": "現金", "cr_amt": 120}], "exp": "支払時は全額を支払家賃（費用）で処理。決算で前払分を振り替える。"}, {"id": 74, "ch": 14, "case": 79, "title": "決算日の処理（費用の前払い）の仕訳", "q": "決算日において、支払家賃のうち40円は翌期分である。前払分を前払家賃に振り替える。", "entries": [{"dr": "前払家賃", "dr_amt": 40, "cr": "支払家賃", "cr_amt": 40}], "exp": "翌期分の費用は前払家賃（資産）に振り替える。当期の費用から除外。"}, {"id": 75, "ch": 14, "case": 80, "title": "お金を借り入れた（利息を後払い）ときの仕訳", "q": "ゴエモン㈱は、銀行から現金600円を借り入れた。利息は返済時に支払う。", "entries": [{"dr": "現金", "dr_amt": 600, "cr": "借入金", "cr_amt": 600}], "exp": "利息は後払いなので借入時には利息の仕訳はしない。"}, {"id": 76, "ch": 14, "case": 81, "title": "決算日の処理（費用の未払い）の仕訳", "q": "決算日において、借入金に対する当期分の利息10円が未払いである。", "entries": [{"dr": "支払利息", "dr_amt": 10, "cr": "未払利息", "cr_amt": 10}], "exp": "当期に属する利息は未払利息（負債）を計上し、支払利息（費用）で処理。"}, {"id": 77, "ch": 14, "case": 82, "title": "地代を前受けしたときの仕訳", "q": "ゴエモン㈱は、向こう1年分の地代120円を現金で受け取った。", "entries": [{"dr": "現金", "dr_amt": 120, "cr": "受取地代", "cr_amt": 120}], "exp": "受取時は全額を受取地代（収益）で処理。決算で前受分を振り替える。"}, {"id": 78, "ch": 14, "case": 83, "title": "決算日の処理（収益の前受け）の仕訳", "q": "決算日において、受取地代のうち40円は翌期分である。前受分を前受地代に振り替える。", "entries": [{"dr": "受取地代", "dr_amt": 40, "cr": "前受地代", "cr_amt": 40}], "exp": "翌期分の収益は前受地代（負債）に振り替える。当期の収益から除外。"}, {"id": 79, "ch": 14, "case": 84, "title": "お金を貸し付けた（利息を後で受け取る）ときの仕訳", "q": "ゴエモン㈱は、取引先に現金500円を貸し付けた。利息は返済時に受け取る。", "entries": [{"dr": "貸付金", "dr_amt": 500, "cr": "現金", "cr_amt": 500}], "exp": "利息は後で受け取るので貸付時には利息の仕訳はしない。"}, {"id": 80, "ch": 14, "case": 85, "title": "決算日の処理（収益の未収）の仕訳", "q": "決算日において、貸付金に対する当期分の利息10円が未収である。", "entries": [{"dr": "未収利息", "dr_amt": 10, "cr": "受取利息", "cr_amt": 10}], "exp": "当期に属する利息は未収利息（資産）を計上し、受取利息（収益）で処理。"}, {"id": 81, "ch": 14, "case": 86, "title": "誤った仕訳を訂正するときの仕訳", "q": "通信費50円を支払った際、誤って消耗品費50円と記帳していたことが判明した。これを訂正する。", "entries": [{"dr": "通信費", "dr_amt": 50, "cr": "消耗品費", "cr_amt": 50}], "exp": "訂正仕訳＝正しい仕訳ー誤った仕訳。消耗品費を取消し、通信費を計上。"}];

{n:14,t:"費用・収益の前払い・前受けと未払い・未収、訂正仕訳",sec:"仕訳編",cases:"78-86",summary:"経過勘定項目（前払費用・未払費用・前受収益・未収収益）の決算整理仕訳、再振替仕訳、訂正仕訳。"},

function renderTextTab(){
  const c=document.getElementById('textSections');
  let secName='';
  let h='';
  CHAPTERS.forEach(ch=>{
    if(ch.sec!==secName){secName=ch.sec;h+=`<h3 style="margin:16px 0 8px;font-size:.85em;color:var(--dim);border-bottom:1px solid var(--bdr);padding-bottom:4px">📚 ${secName}</h3>`}
    const views=S.textViews[ch.n]||0;
    const badge=views>0?`✅ ${views}回閲覧`:'未読';
    const cases=ALL.filter(q=>q.ch===ch.n);
    let body=`<p style="margin-bottom:10px">${ch.summary}</p>`;
    if(cases.length>0){
      body+=`<h4 style="font-size:.85em;margin:10px 0 6px">📝 この章の仕訳（${cases.length}問）</h4>`;
      cases.forEach(q=>{
        let je='';
        q.entries.forEach(e=>{
          if(e.dr)je+=`<span class="dr">（${e.dr}）${e.dr_amt}</span> `;
          if(e.cr)je+=`<span class="cr">（${e.cr}）${e.cr_amt}</span> `;
        });
        body+=`<div class="case-item"><div class="case-title">CASE ${q.case}: ${q.title}</div><div style="font-size:.82em;color:var(--dim);margin:4px 0">${q.q}</div><div class="case-je">${formatJE(q.entries)}</div></div>`;
      });
    } else {
      body+=`<p style="color:var(--dim);font-size:.85em">（この章の問題データは準備中です）</p>`;
    }
    h+=`<div class="acc-section" data-ch="${ch.n}"><div class="acc-hdr" onclick="toggleAcc(this,${ch.n})"><span class="ch-num">第${ch.n}章</span><span class="ch-title">${ch.t}</span><span class="ch-badge">${badge}</span><span class="arrow">▶</span></div><div class="acc-body">${body}</div></div>`;
  });
  c.innerHTML=h;
}

function toggleAcc(el,chNum){
  const sec=el.parentElement;
  const wasOpen=sec.classList.contains('open');
  sec.classList.toggle('open');
  if(!wasOpen){
    S.textViews[chNum]=(S.textViews[chNum]||0)+1;
    save();
    // Update badge
    el.querySelector('.ch-badge').textContent=`✅ ${S.textViews[chNum]}回閲覧`;
  }
}

function formatJE(entries){
  let drItems=[],crItems=[];
  entries.forEach(e=>{
    if(e.dr)drItems.push({name:e.dr,amt:e.dr_amt});
    if(e.cr)crItems.push({name:e.cr,amt:e.cr_amt});
  });
  let html='<table style="width:100%;font-size:.9em"><tr><td style="border-right:1px solid var(--bdr);padding-right:8px;vertical-align:top;width:50%">';
  drItems.forEach(d=>{html+=`<div>（<b>${d.name}</b>）<span style="float:right">${d.amt.toLocaleString()}</span></div>`});
  html+='</td><td style="padding-left:8px;vertical-align:top">';
  crItems.forEach(c=>{html+=`<div>（<b>${c.name}</b>）<span style="float:right">${c.amt.toLocaleString()}</span></div>`});
  html+='</td></tr></table>';
  return html;
}

let quizState={mode:'',questions:[],idx:0,correct:0,answered:0,chFilter:new Set(),timer:null,startTime:0};
const MODES=[
  {id:'seq',ico:'📖',lbl:'テキスト順',sub:'章の順番で出題'},
  {id:'shuf',ico:'🔀',lbl:'シャッフル',sub:'ランダム出題'},
  {id:'weak',ico:'💪',lbl:'苦手復習',sub:'間違えた問題'},
  {id:'mini',ico:'📝',lbl:'ミニテスト',sub:'25問テスト'},
  {id:'srs',ico:'🧠',lbl:'忘却曲線',sub:'間隔反復法'},
  {id:'daily',ico:'📅',lbl:'デイリー',sub:'毎日の復習'}
];

function renderQuizMenu(){
  // Chapter filter
  const cf=document.getElementById('chFilter');
  let fh='<span class="ch-tag act" onclick="toggleChFilter(0,this)">全章</span>';
  CHAPTERS.forEach(ch=>{
    const cnt=ALL.filter(q=>q.ch===ch.n).length;
    if(cnt>0)fh+=`<span class="ch-tag" onclick="toggleChFilter(${ch.n},this)">${ch.n}章(${cnt})</span>`;
  });
  cf.innerHTML=fh;

  // Mode grid
  const mg=document.getElementById('modeGrid');
  mg.innerHTML=MODES.map(m=>`<div class="mode-btn" onclick="startQuiz('${m.id}')"><div class="ico">${m.ico}</div><div class="lbl">${m.lbl}</div><div class="sub">${m.sub}</div></div>`).join('');
}

function toggleChFilter(n,el){
  if(n===0){quizState.chFilter.clear();document.querySelectorAll('.ch-tag').forEach(t=>{t.classList.remove('act')});el.classList.add('act');return}
  document.querySelector('.ch-tag').classList.remove('act');// Remove "all"
  el.classList.toggle('act');
  if(quizState.chFilter.has(n))quizState.chFilter.delete(n);else quizState.chFilter.add(n);
  if(quizState.chFilter.size===0)document.querySelector('.ch-tag').classList.add('act');
}

function getFilteredQuestions(){
  if(quizState.chFilter.size===0)return [...ALL];
  return ALL.filter(q=>quizState.chFilter.has(q.ch));
}

function startQuiz(mode){
  quizState.mode=mode;
  let qs=getFilteredQuestions();
  if(qs.length===0){alert('選択した章に問題がありません');return}

  switch(mode){
    case'seq':break;
    case'shuf':qs=shuffle(qs);break;
    case'weak':qs=qs.filter(q=>{const s=S.stats[q.id];return s&&s.cnt>0&&(s.ok/s.cnt)<0.6});if(qs.length===0){alert('苦手問題がありません。まず問題を解いてみましょう');return}break;
    case'mini':qs=shuffle(qs).slice(0,Math.min(25,qs.length));break;
    case'srs':{const now=Date.now();qs=qs.filter(q=>{const s=S.stats[q.id];if(!s||!s.srs_next)return true;return now>=s.srs_next}).sort((a,b)=>{const sa=S.stats[a.id],sb=S.stats[b.id];const na=sa?.srs_next||0,nb=sb?.srs_next||0;return na-nb}).slice(0,20);if(qs.length===0){alert('復習すべき問題はありません。後でまた来てください');return}break}
    case'daily':{const now=Date.now();const review=qs.filter(q=>{const s=S.stats[q.id];return s&&s.srs_next&&now>=s.srs_next}).slice(0,10);const newQ=qs.filter(q=>!S.stats[q.id]||S.stats[q.id].cnt===0).slice(0,5);qs=[...review,...newQ];if(qs.length===0){alert('今日の学習は完了です！');return}break}
  }

  quizState.questions=qs;quizState.idx=0;quizState.correct=0;quizState.answered=0;
  quizState.startTime=Date.now();
  document.getElementById('quizMenu').classList.add('hide');
  document.getElementById('quizPlay').classList.remove('hide');
  document.getElementById('backBtn').classList.remove('hide');
  showQuestion();
}

function showQuestion(){
  const q=quizState.questions[quizState.idx];
  if(!q){showResult();return}
  const total=quizState.questions.length;
  const pct=Math.round((quizState.idx/total)*100);

  // Count max entries needed
  const maxDr=q.entries.filter(e=>e.dr).length;
  const maxCr=q.entries.filter(e=>e.cr).length;
  const rows=Math.max(maxDr,maxCr,1)+1; // +1 extra row for user

  let formRows='';
  for(let i=0;i<rows;i++){
    formRows+=`<div class="je-row"><div class="je-cell"><select id="dr_acct_${i}"><option value="">―</option>${ACCT_NAMES.map(a=>`<option value="${a}">${a}</option>`).join('')}</select><input type="number" id="dr_amt_${i}" placeholder="金額"></div><div class="je-cell"><select id="cr_acct_${i}"><option value="">―</option>${ACCT_NAMES.map(a=>`<option value="${a}">${a}</option>`).join('')}</select><input type="number" id="cr_amt_${i}" placeholder="金額"></div></div>`;
  }

  const memo=S.stats[q.id]?.memo||'';
  const el=document.getElementById('quizPlay');
  el.innerHTML=`<div class="fade-in">
<div class="q-num">問題 ${quizState.idx+1} / ${total}（第${q.ch}章 CASE${q.case}）</div>
<div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>
<div class="q-text">${q.q}</div>
<div class="je-form">
<div class="je-hdr"><div>借方（左側）</div><div>貸方（右側）</div></div>
${formRows}
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-pri btn-block" onclick="checkAnswer()">解答する</button>
</div>
<div id="ansResult"></div>
<div style="margin-top:12px"><textarea class="memo-area" style="min-height:40px" placeholder="この問題のメモ…" id="qMemo" oninput="saveQMemo(${q.id})">${memo}</textarea></div>
</div>`;
  if(S.settings.tts)speak(q.q);
}

function checkAnswer(){
  const q=quizState.questions[quizState.idx];
  // Collect user answers
  let userDr=[],userCr=[];
  for(let i=0;i<10;i++){
    const da=document.getElementById('dr_acct_'+i);
    const dv=document.getElementById('dr_amt_'+i);
    if(!da)break;
    if(da.value)userDr.push({name:da.value,amt:parseInt(dv.value)||0});
    const ca=document.getElementById('cr_acct_'+i);
    const cv=document.getElementById('cr_amt_'+i);
    if(ca.value)userCr.push({name:ca.value,amt:parseInt(cv.value)||0});
  }

  // Expected answers
  let expDr=[],expCr=[];
  q.entries.forEach(e=>{
    if(e.dr)expDr.push({name:e.dr,amt:e.dr_amt});
    if(e.cr)expCr.push({name:e.cr,amt:e.cr_amt});
  });

  // Check correctness
  const drOk=arraysMatch(userDr,expDr);
  const crOk=arraysMatch(userCr,expCr);
  const isCorrect=drOk&&crOk;

  // Update stats
  if(!S.stats[q.id])S.stats[q.id]={cnt:0,ok:0,last:0,memo:'',srs_interval:1,srs_next:0};
  const st=S.stats[q.id];
  st.cnt++;st.last=Date.now();
  if(isCorrect){st.ok++;st.srs_interval=Math.min(st.srs_interval*2.5,30);quizState.correct++}
  else{st.srs_interval=1}
  st.srs_next=Date.now()+st.srs_interval*24*60*60*1000;
  quizState.answered++;

  // Daily stats
  const today=new Date().toISOString().slice(0,10);
  if(!S.daily[today])S.daily[today]={cnt:0,ok:0};
  S.daily[today].cnt++;
  if(isCorrect)S.daily[today].ok++;
  save();

  // Show result
  const cls=isCorrect?'ans-correct':'ans-wrong';
  const icon=isCorrect?'⭕ 正解！':'❌ 不正解';
  let h=`<div class="${cls}" style="margin-top:12px"><div style="font-weight:700;font-size:1.1em;margin-bottom:8px">${icon}</div>`;
  h+=`<div style="font-size:.85em;font-weight:600;margin-bottom:6px">正しい仕訳：</div>`;
  h+=`<div class="ans-entry">${formatJE(q.entries)}</div>`;
  h+=`<div class="exp-text">💡 ${q.exp}</div></div>`;
  h+=`<button class="btn btn-pri btn-block" onclick="nextQuestion()" style="margin-top:8px">${quizState.idx<quizState.questions.length-1?'次の問題 ▶':'結果を見る'}</button>`;
  document.getElementById('ansResult').innerHTML=h;
}

function arraysMatch(user,expected){
  if(user.length!==expected.length)return false;
  const sortFn=(a,b)=>a.name.localeCompare(b.name,'ja')||a.amt-b.amt;
  const u=[...user].sort(sortFn);
  const e=[...expected].sort(sortFn);
  return u.every((item,i)=>item.name===e[i].name&&item.amt===e[i].amt);
}

function nextQuestion(){quizState.idx++;showQuestion()}

function showResult(){
  const pct=quizState.answered>0?Math.round(quizState.correct/quizState.answered*100):0;
  const elapsed=Math.round((Date.now()-quizState.startTime)/1000);
  const min=Math.floor(elapsed/60);
  const sec=elapsed%60;
  const el=document.getElementById('quizPlay');
  el.innerHTML=`<div class="fade-in" style="text-align:center;padding:20px">
<div style="font-size:3em;margin-bottom:10px">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>
<h2>テスト結果</h2>
<div class="stat-grid" style="margin:16px 0">
<div class="stat-box"><div class="num">${pct}%</div><div class="lbl">正答率</div></div>
<div class="stat-box"><div class="num">${quizState.correct}/${quizState.answered}</div><div class="lbl">正解数</div></div>
<div class="stat-box"><div class="num">${min}:${sec.toString().padStart(2,'0')}</div><div class="lbl">所要時間</div></div>
<div class="stat-box"><div class="num">${MODES.find(m=>m.id===quizState.mode)?.lbl||''}</div><div class="lbl">モード</div></div>
</div>
<button class="btn btn-pri btn-block" onclick="switchTab('T-quiz')">問題選択に戻る</button>
</div>`;
}

/* ===== STATS ===== */
function renderStats(){
  const totalQ=ALL.length;
  const attempted=Object.keys(S.stats).filter(k=>S.stats[k].cnt>0).length;
  const totalAns=Object.values(S.stats).reduce((s,v)=>s+v.cnt,0);
  const totalOk=Object.values(S.stats).reduce((s,v)=>s+v.ok,0);
  const pct=totalAns>0?Math.round(totalOk/totalAns*100):0;
  const textViewed=Object.keys(S.textViews).length;

  document.getElementById('statGrid').innerHTML=`
<div class="stat-box"><div class="num">${attempted}/${totalQ}</div><div class="lbl">回答済み問題</div></div>
<div class="stat-box"><div class="num">${pct}%</div><div class="lbl">通算正答率</div></div>
<div class="stat-box"><div class="num">${totalAns}</div><div class="lbl">総回答数</div></div>
<div class="stat-box"><div class="num">${textViewed}/19</div><div class="lbl">テキスト閲覧章</div></div>`;

  // Calendar
  const cal=document.getElementById('calGrid');
  const today=new Date();
  let ch='<div style="font-size:.6em;text-align:center;color:var(--dim)">日</div><div style="font-size:.6em;text-align:center;color:var(--dim)">月</div><div style="font-size:.6em;text-align:center;color:var(--dim)">火</div><div style="font-size:.6em;text-align:center;color:var(--dim)">水</div><div style="font-size:.6em;text-align:center;color:var(--dim)">木</div><div style="font-size:.6em;text-align:center;color:var(--dim)">金</div><div style="font-size:.6em;text-align:center;color:var(--dim)">土</div>';
  const start=new Date(today.getFullYear(),today.getMonth(),1);
  for(let i=0;i<start.getDay();i++)ch+='<div></div>';
  for(let d=1;d<=31;d++){
    const dt=new Date(today.getFullYear(),today.getMonth(),d);
    if(dt.getMonth()!==today.getMonth())break;
    const key=dt.toISOString().slice(0,10);
    const daily=S.daily[key];
    const bg=daily?(daily.ok/daily.cnt>=0.8?'var(--acc2)':'var(--pri)'):'var(--bdr)';
    const op=daily?1:0.3;
    ch+=`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;background:${bg};opacity:${op};font-size:.7em;color:#fff">${d}</div>`;
  }
  cal.innerHTML=ch;

  // Chapter progress
  let cp='';
  CHAPTERS.forEach(ch=>{
    const qs=ALL.filter(q=>q.ch===ch.n);
    if(qs.length===0)return;
    const done=qs.filter(q=>S.stats[q.id]?.cnt>0).length;
    const ok=qs.filter(q=>{const s=S.stats[q.id];return s&&s.cnt>0&&s.ok/s.cnt>=0.6}).length;
    const pct=qs.length>0?Math.round(done/qs.length*100):0;
    cp+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:.85em"><span style="width:50px;font-weight:600">第${ch.n}章</span><div class="prog" style="flex:1;margin:0"><div class="prog-fill" style="width:${pct}%"></div></div><span style="font-size:.75em;color:var(--dim)">${done}/${qs.length}</span></div>`;
  });
  document.getElementById('chProgress').innerHTML=cp;
}

/* ===== UTILITIES ===== */
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function speak(text){if(!S.settings.tts)return;try{const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';speechSynthesis.speak(u)}catch(e){}}

function toggleMemo(){
  const o=document.getElementById('memoOverlay');
  o.classList.toggle('hide');
  if(!o.classList.contains('hide'))o.style.display='flex';
  else o.style.display='';
}
function saveMemo(){S.memo=document.getElementById('memoText').value;save()}
function saveQMemo(id){
  if(!S.stats[id])S.stats[id]={cnt:0,ok:0,last:0,memo:'',srs_interval:1,srs_next:0};
  S.stats[id].memo=document.getElementById('qMemo')?.value||'';save();
}
function saveGoal(){
  S.settings.goalCount=parseInt(document.getElementById('goalCount').value)||10;
  S.settings.goalRate=parseInt(document.getElementById('goalRate').value)||80;
  save();
}

function applySettings(){
  if(S.settings.dark)document.body.classList.add('dark');
  document.body.style.fontSize=S.settings.fontSize||'16px';
  if(S.settings.dark)document.getElementById('darkToggle').classList.add('on');
  if(S.settings.tts)document.getElementById('ttsToggle').classList.add('on');
  document.getElementById('fontSel').value=S.settings.fontSize||'16px';
}
function toggleDark(){
  S.settings.dark=!S.settings.dark;
  document.body.classList.toggle('dark');
  document.getElementById('darkToggle').classList.toggle('on');
  save();
}
function setFontSize(v){S.settings.fontSize=v;document.body.style.fontSize=v;save()}
function toggleTTS(){
  S.settings.tts=!S.settings.tts;
  document.getElementById('ttsToggle').classList.toggle('on');
  save();
}

function showQList(){
  const el=document.getElementById('qList');
  el.classList.toggle('hide');
  if(!el.classList.contains('hide')){
    let h='';
    ALL.forEach(q=>{
      const s=S.stats[q.id];
      const icon=s?.cnt>0?(s.ok/s.cnt>=0.8?'🟢':s.ok/s.cnt>=0.5?'🟡':'🔴'):'⚪';
      h+=`<div style="padding:6px;border-bottom:1px solid var(--bdr);font-size:.8em">${icon} <b>${q.ch}章</b> CASE${q.case}: ${q.title} ${s?`(${s.ok}/${s.cnt})`:''}</div>`;
    });
    el.innerHTML=h;
  }
}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='boki3_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{S=JSON.parse(ev.target.result);save();alert('データを読み込みました');location.reload()}
    catch(err){alert('ファイルの読み込みに失敗しました')}
  };reader.readAsText(file);
}
function resetData(){
  if(confirm('すべての学習データをリセットしますか？\nこの操作は元に戻せません。')){
    localStorage.removeItem(LS_KEY);location.reload();
  }
}
